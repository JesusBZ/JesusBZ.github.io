<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Mensaje Enviado Exitosamente | Jesús B. Zerpa</title>
  <link rel="icon" href="favi.png" type="image/png" />
  <link rel="stylesheet" href="css/futuristic-corporate.css?v=20261029c" />
  <style>
    .success-hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
    }
    .success-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 3.5rem 2.5rem;
      max-width: 600px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .success-icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(16, 185, 129, 0.3);
    }
    .success-icon-badge svg {
      width: 36px;
      height: 36px;
      stroke-width: 2.5;
    }
    .success-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--corporate-navy);
      letter-spacing: -0.02em;
    }
    .success-desc {
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.65;
    }
    .btn-return-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--corporate-blue);
      color: #ffffff;
      font-weight: 700;
      padding: 0.75rem 1.75rem;
      border-radius: var(--radius-md);
      text-decoration: none !important;
      box-shadow: 0 8px 20px -3px rgba(0, 82, 204, 0.35);
      transition: all var(--transition-fast);
      margin-top: 0.5rem;
    }
    .btn-return-home:hover {
      background: var(--corporate-blue-hover);
      transform: translateY(-2px);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="site-container success-hero">
    <div class="success-card">
      <div class="success-icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h1 class="success-title">Mensaje Enviado con Éxito</h1>
      <p class="success-desc">
        Gracias por ponerte en contacto. Tu comunicación ha sido recibida y será atendida con la mayor celeridad profesional.
      </p>
      <a href="index.html" class="btn-return-home">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Volver al Portafolio</span>
      </a>
    </div>
  </div>
</body>
</html>
